[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-functions"
version = "0.1.0"
description = "A few simple functions, for practising continuous integration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ada-hy126", email = "hy126@ic.ac.uk" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "flake8"]
